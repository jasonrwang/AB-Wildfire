# Batch dependency updates into one PR per category instead of one per package.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      dependencies:
        applies-to: version-updates
        patterns: ["*"]

  # Keeps the actions used in .github/workflows (checkout, setup-uv, Pages) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
